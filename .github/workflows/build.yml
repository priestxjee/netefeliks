name: Fire-TV-APK bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Version und Update-Adresse eintragen
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s#__NFK_REPO__#${{ github.repository }}#; s#__NFK_VERSION__#${{ github.run_number }}#" app/src/main/assets/index.html
      - run: gradle :app:assembleRelease
      - name: Update-Dateien vorbereiten
        run: |
          cp app/build/outputs/apk/release/app-release.apk Netefeliks.apk
          cp app/src/main/assets/index.html index.html
          NATIVE=$(cat native-version.txt 2>/dev/null || echo 1)
          NOTES=$(head -n 6 CHANGELOG.txt 2>/dev/null || echo "Neue Version")
          jq -n --argjson v ${{ github.run_number }} --argjson n "$NATIVE" --arg notes "$NOTES" '{version:$v,native:$n,notes:$notes}' > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: Netefeliks-APK
          path: Netefeliks.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Netefeliks ${{ github.run_number }}
          body: Neue Version von Netefeliks
          files: |
            Netefeliks.apk
            index.html
            version.json
          make_latest: true
