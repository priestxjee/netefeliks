<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Netefeliks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700;800&family=Vazirmatn:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
/* Layout: schmale Seitenleiste links, Bühne rechts. Startseite = Spotlight (oben, ~54%) + horizontale Reihen darunter, wie eine TV-App im 16:9-Raster. Bewusst nur dunkles Theme (TV). */
:root{
  --bg:#0d0b0b; --bg2:#161212; --card:#1e1919; --line:#332a29; --fg:#f5f0ee; --mute:#a99f9c; --dim:#716866;
  --red:#e3262d; --red2:#ff545a; --gold:#f2c230; --ok:#46d483;
  --f-brand:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --f-body:'Figtree','Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-fa:'Vazirmatn','Figtree',Tahoma,sans-serif;
  --f-serif:'DM Serif Display',Georgia,serif;
  --f-heavy:'Anton',Impact,'Arial Narrow',sans-serif;
  --rail:4.4rem; --gut:2.4rem;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
html{font-size:clamp(13px,.95vw,24px)}
body{font-family:var(--f-body);font-size:1rem;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
.f:focus{outline:none}
[dir=rtl],.fa{font-family:var(--f-fa)}

/* ---------- Seitenleiste ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:30;display:flex;flex-direction:column;justify-content:center;gap:.25rem;padding:1rem .55rem;padding-left:max(.55rem,env(safe-area-inset-left,0px));background:linear-gradient(90deg,rgba(13,11,11,.97) 40%,rgba(13,11,11,0));transition:width .22s ease,background .22s}
.rail:focus-within,.rail:hover{width:16rem;background:linear-gradient(90deg,#0d0b0b 65%,rgba(13,11,11,0))}
.rail .brand{position:absolute;top:1.1rem;left:max(1rem,env(safe-area-inset-left,0px));font-family:var(--f-brand);color:var(--red);font-size:2.1rem;letter-spacing:.02em;line-height:1;white-space:nowrap}
.rail .brand b{font-weight:400;display:none}
.rail:focus-within .brand b,.rail:hover .brand b{display:inline}
.rail:focus-within .brand i,.rail:hover .brand i{display:none}
.rail .brand i{font-style:normal}
.nav{display:flex;align-items:center;gap:1.05rem;padding:.62rem .75rem;border-radius:.45rem;color:var(--mute);white-space:nowrap;overflow:hidden;background:none;border:0;font-size:1.05rem;font-weight:600;cursor:pointer;width:100%;text-align:left}
.nav svg{flex:0 0 1.45rem;height:1.45rem}
.nav span{opacity:0;transition:opacity .15s}
.rail:focus-within .nav span,.rail:hover .nav span{opacity:1}
.nav.on{color:var(--fg)}
.nav.on svg{color:var(--red)}
.nav:focus{background:var(--fg);color:#111}
.nav:focus svg{color:#111}
.rail .who{position:absolute;bottom:1.2rem;left:max(.55rem,env(safe-area-inset-left,0px));right:.55rem}

/* ---------- Bühne ---------- */
.main{position:absolute;top:0;bottom:0;left:var(--rail);right:0;overflow-y:auto;overflow-x:hidden;padding-bottom:4rem;scroll-behavior:smooth}
.main.home{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.pad{padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{padding-top:2.2rem}
.vtitle{font-family:var(--f-brand);font-size:3rem;letter-spacing:.02em;margin:0 0 .3rem;font-weight:400;line-height:1}
.vsub{color:var(--mute);margin:0 0 1.2rem;font-size:1rem}

/* ---------- Spotlight ---------- */
.spot{flex:0 0 54%;position:relative;overflow:hidden;min-height:15rem}
.spot .bd{position:absolute;top:0;right:0;width:72%;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 35%);mask-image:linear-gradient(90deg,transparent 0,#000 35%)}
.spot .bd::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0,rgba(13,11,11,0) 40%)}
.spot .bd img{width:100%;height:100%;object-fit:cover}
.spot{transition:flex-basis .35s ease}
.spot.hero{flex-basis:60%}
.bdimg{position:absolute;inset:0}
.bd.kb .bdimg,.hero .bd.kb>.art,.hero .bd.kb>img{animation:kb 34s ease-in-out infinite alternate}
.hero .bd{position:absolute;inset:0;overflow:hidden}
.yt{position:absolute;left:0;top:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1s;pointer-events:none;transform:scale(1.32);z-index:1}
video.yt{transform:none;object-fit:cover;background:transparent}
.yt.on{opacity:1}
.spot .bd::after{z-index:2}
.s-title.one{-webkit-line-clamp:1}
.s-plot.two{-webkit-line-clamp:2}
.htag{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--mute);display:flex;gap:.5rem;align-items:center}
.dots{display:inline-flex;gap:.45rem;margin-left:.8rem;align-items:center}
.dot{width:.6rem;height:.6rem;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer;transition:transform .15s,background .15s}
.dot.on{background:var(--fg);width:1.6rem;border-radius:1rem}
.dot:focus{transform:scale(1.5);box-shadow:0 0 0 2px var(--red2)}
.t10{flex:0 0 auto;display:flex;align-items:flex-end}
.t10 .rk{font:400 9rem/.78 var(--f-heavy);color:var(--bg);-webkit-text-stroke:3px #7d7270;margin-right:-1.4rem;letter-spacing:-.04em;user-select:none}
.t10 .card{position:relative}
.vtitle.sm{font-size:1.9rem;margin-top:.3rem}
.vtitle small{font:600 .9rem var(--f-body);color:var(--mute);letter-spacing:0;margin-left:.4rem}
.spot .info{position:absolute;left:var(--gut);bottom:1rem;width:min(42rem,58%);display:flex;flex-direction:column;gap:.6rem}
.s-title{margin:0;font-size:3.3rem;line-height:.98;font-weight:400;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-plot{margin:0;color:#ddd5d2;font-size:1.02rem;line-height:1.5;max-width:38rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.s-why{font-size:.9rem;color:var(--mute);font-weight:600}
.s-why b{color:var(--fg)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .8rem;font-size:.95rem;color:#d8d0cd;font-variant-numeric:tabular-nums}
.match{color:var(--ok);font-weight:800}
.tag{border:1px solid rgba(255,255,255,.45);padding:.05rem .4rem;border-radius:.2rem;font-size:.75rem;font-weight:700;letter-spacing:.05em}
.tag.k{border-color:var(--gold);color:var(--gold)}
.live{background:var(--red);color:#fff;padding:.12rem .45rem;border-radius:.2rem;font-size:.72rem;font-weight:800;letter-spacing:.08em}
.flag{font-size:1.05em}
.langs{display:inline-flex;gap:.3rem;align-items:center}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.lrow b{font-weight:600}

/* Bewertungen */
.rts{display:flex;flex-wrap:wrap;gap:.55rem}
.rb{display:inline-flex;align-items:center;gap:.45rem;padding:.38rem .65rem .38rem .45rem;border-radius:.4rem;background:rgba(255,255,255,.08);font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rb small{font-weight:600;color:var(--mute);font-size:.72rem;letter-spacing:.02em}
.rb svg{width:1.35rem;height:1.35rem;flex:0 0 auto}
.rb .imdb{background:var(--gold);color:#111;font:800 .78rem/1 var(--f-body);padding:.28rem .38rem;border-radius:.2rem;letter-spacing:-.01em}
.rb.na{opacity:.5}

/* ---------- Reihen & Karten ---------- */
.rows{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:3rem;scroll-behavior:smooth}
.row{padding-top:.5rem}
.row h3{margin:0;font-size:1.18rem;font-weight:700;letter-spacing:.005em}
.row h3 small{color:var(--mute);font-weight:500;font-size:.85rem;margin-left:.5rem}
.track{display:flex;gap:.75rem;overflow-x:auto;overflow-y:hidden;padding-top:.85rem;padding-bottom:1.1rem;scroll-behavior:smooth;scrollbar-width:none;scroll-padding-left:var(--gut)}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 9.4rem;position:relative;border:0;padding:0;background:var(--card);border-radius:.35rem;overflow:hidden;aspect-ratio:2/3;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;max-width:100%}
.card.w{flex-basis:16.5rem;aspect-ratio:16/9}
.card:focus{transform:scale(1.08);box-shadow:0 0 0 3px var(--fg),0 14px 34px rgba(0,0,0,.7);z-index:3}
.card img.pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bdg{position:absolute;top:.4rem;left:.4rem;z-index:2;font:800 .62rem/1 var(--f-body);padding:.24rem .36rem;border-radius:.2rem;background:rgba(0,0,0,.7);letter-spacing:.07em;color:#fff}
.bdg.k{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ribbon{position:absolute;bottom:.55rem;left:50%;transform:translateX(-50%);z-index:2;background:var(--red);color:#fff;font:800 .6rem/1 var(--f-body);letter-spacing:.08em;padding:.28rem .5rem;border-radius:.15rem;white-space:nowrap}
.pbar{position:absolute;left:0;right:0;bottom:0;height:.26rem;background:rgba(255,255,255,.25);z-index:2}
.pbar i{display:block;height:100%;background:var(--red)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1.6rem .7rem .7rem;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);text-align:left;font-size:.88rem;font-weight:700;line-height:1.25}
.cap small{display:block;color:var(--mute);font-weight:500;font-size:.78rem;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.w .pbar{bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.4rem,1fr));gap:1.1rem .8rem;padding-top:.6rem}
.grid .card{flex:none;width:100%}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}

/* Generierte Poster (wenn der Server kein Bild liefert / Demo) */
.art{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:.25rem;padding:.75rem;text-align:left;
  background:radial-gradient(120% 75% at 30% 18%,var(--a),transparent 62%),linear-gradient(165deg,var(--b),#070505 85%);box-shadow:inset 0 -70px 60px -20px rgba(0,0,0,.85)}
.art::before,.art::after{content:"";position:absolute;pointer-events:none}
.m0::before{width:72%;aspect-ratio:1;border-radius:50%;left:14%;top:10%;background:radial-gradient(circle at 38% 32%,var(--c),var(--a) 72%);opacity:.9;box-shadow:0 0 70px var(--a)}
.m1::before{inset:-30%;background:repeating-linear-gradient(115deg,transparent 0 16px,var(--c2) 16px 21px)}
.m2::before{left:-10%;right:-10%;bottom:30%;height:46%;background:#0a0707;clip-path:polygon(0 100%,22% 34%,38% 66%,62% 8%,100% 100%)}
.m2::after{width:28%;aspect-ratio:1;border-radius:50%;right:16%;top:12%;background:var(--c);box-shadow:0 0 50px var(--c)}
.m3::before{width:150%;aspect-ratio:1;left:-25%;top:-18%;border-radius:50%;background:repeating-radial-gradient(circle,var(--c2) 0 2px,transparent 2px 15px)}
.m4::before{left:38%;top:-10%;width:24%;height:125%;background:linear-gradient(var(--c),transparent 85%);filter:blur(14px);transform:skewX(-14deg)}
.m4::after{left:10%;right:10%;bottom:34%;height:1px;background:var(--c);box-shadow:0 0 18px var(--c)}
.m5::before{left:-50%;right:-50%;bottom:0;height:58%;background:repeating-linear-gradient(90deg,var(--c2) 0 1px,transparent 1px 26px),repeating-linear-gradient(0deg,var(--c2) 0 1px,transparent 1px 20px);transform:perspective(160px) rotateX(58deg);transform-origin:bottom}
.art-t{position:relative;z-index:1;font-size:1.3rem;line-height:1.02;text-shadow:0 2px 14px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.art-y{position:relative;z-index:1;font-size:.7rem;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.7)}
.ft-a{font-family:var(--f-brand);font-size:1.75rem;text-transform:uppercase;letter-spacing:.02em}
.ft-b{font-family:var(--f-heavy);text-transform:uppercase;letter-spacing:.01em}
.ft-c{font-family:var(--f-serif);font-style:italic;font-size:1.45rem}
.ft-fa{font-family:var(--f-fa);font-weight:800;text-align:right;direction:rtl;font-size:1.4rem}
.s-title.ft-a,.s-title.ft-b,.s-title.ft-c{font-size:3.3rem}
.cap .pb{display:block;height:.18rem;background:rgba(255,255,255,.2);margin-top:.35rem;border-radius:1rem;overflow:hidden}
.cap .pb i{display:block;height:100%;background:var(--red)}
.art.wd{padding:0}
.art.wd .art-t,.art.wd .art-y{display:none}
.art.wd.m0::before{width:40%;left:45%;top:8%}
.art.wd.m2::after{width:16%}
.card.w .art .art-t{font-size:1.15rem}
.card.w .art .ft-a{font-size:1.55rem}

/* Senderlogo (generiert) */
.logo{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 0%,var(--a),var(--b));padding:.6rem;text-align:center}
.logo span{font-family:var(--f-heavy);font-size:1.5rem;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.5);overflow-wrap:anywhere}
.logo span[dir=rtl]{font-family:var(--f-fa);font-weight:800;text-transform:none}
.logo img{max-width:70%;max-height:70%;object-fit:contain}
.card.ch .logo{bottom:3.3rem}
.card.ch .cap{padding-top:.6rem;background:#141010}

/* ---------- Buttons, Chips, Eingaben ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.72rem 1.45rem;border-radius:.35rem;border:0;font-weight:700;font-size:1.05rem;background:rgba(120,108,105,.42);cursor:pointer;transition:transform .12s;white-space:nowrap}
.btn svg{width:1.3rem;height:1.3rem}
.btn.pri{background:var(--red);color:#fff}
.btn:focus{background:var(--fg);color:#111;transform:scale(1.05)}
.btn.sm{padding:.5rem .9rem;font-size:.92rem}
.btn.ic{padding:.7rem;border-radius:50%}
.btn.on{color:var(--ok)}
.btn.on:focus{color:#0b6b37}
.chips{display:flex;flex-wrap:wrap;gap:.55rem}
.chip{padding:.5rem 1.05rem;border-radius:2rem;border:1.5px solid var(--line);background:none;color:var(--mute);font-weight:700;font-size:.95rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--fg);color:#111;border-color:var(--fg)}
.chip:focus{box-shadow:0 0 0 3px var(--red2);color:var(--fg);border-color:transparent}
.chip.on:focus{color:#111}
.in{width:100%;padding:.95rem 1.05rem;border-radius:.4rem;border:2px solid var(--line);background:#1a1515;color:var(--fg);font:500 1.05rem var(--f-body)}
.in:focus{border-color:var(--fg);outline:none;background:#211b1b}
label.lb{display:block;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 .4rem}

/* ---------- Onboarding ---------- */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:5vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:72rem;margin:0 auto;position:relative;z-index:1}
.wordmark{font-family:var(--f-brand);color:var(--red);font-size:clamp(3.4rem,8vw,7rem);line-height:.85;letter-spacing:.01em;margin:0;text-shadow:0 6px 40px rgba(227,38,45,.35)}
.wall{position:absolute;inset:-20%;display:grid;grid-template-columns:repeat(8,1fr);gap:.8rem;transform:rotate(-8deg);opacity:.22;pointer-events:none}
.wall .card{flex:none;width:100%;transform:none!important}
.scr.login::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 20% 30%,rgba(13,11,11,.4),var(--bg) 75%);pointer-events:none}
.login .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:3rem;align-items:center;min-height:88vh}
.login .pitch p{color:#d6cecb;font-size:1.25rem;line-height:1.5;max-width:30rem;margin:1.2rem 0 0}
.panel{background:rgba(22,18,18,.92);border:1px solid var(--line);border-radius:.7rem;padding:1.8rem;display:flex;flex-direction:column;gap:1rem;box-shadow:0 30px 80px rgba(0,0,0,.6);min-width:0}
.tabs{display:flex;gap:.4rem;background:#0f0c0c;padding:.3rem;border-radius:.5rem}
.tabs .chip{flex:1;border:0;border-radius:.35rem;text-align:center}
.plist{display:flex;flex-direction:column;gap:.45rem;align-items:flex-start}.prow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;font-size:.9rem}
.hint{font-size:.85rem;color:var(--mute);line-height:1.5;margin:0}
.err{background:rgba(227,38,45,.14);border:1px solid rgba(227,38,45,.5);color:#ffd3d4;border-radius:.4rem;padding:.75rem .9rem;font-size:.9rem;line-height:1.45}
.or{display:flex;align-items:center;gap:.8rem;color:var(--dim);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{display:flex;gap:.5rem;margin-bottom:1.6rem}
.steps i{height:.25rem;flex:0 0 2.5rem;border-radius:1rem;background:var(--line)}
.steps i.on{background:var(--red)}
h2.big{font-size:2.4rem;margin:0 0 .4rem;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.ccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.9rem;margin:1.6rem 0}
.cc{position:relative;text-align:left;border:2px solid var(--line);background:var(--bg2);border-radius:.6rem;padding:1rem 1.1rem;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;align-items:center;transition:transform .12s;min-width:0}
.cc .fl{grid-row:span 2;font-size:2.1rem;line-height:1;width:2.6rem;text-align:center}
.cc .fl.txt{font:800 1rem var(--f-body);background:var(--line);border-radius:.3rem;padding:.55rem 0}
.cc b{font-size:1.1rem}
.cc .n{color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums;line-height:1.45}
.cc .n span{white-space:nowrap}
.cc.on{border-color:var(--red);background:#251515}
.cc.on::after{content:"";position:absolute;top:.7rem;right:.7rem;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--red);content:attr(data-n);display:grid;place-items:center;font:800 .78rem/1 var(--f-body);color:#fff;width:1.5rem;height:1.5rem}
.cc:focus{transform:scale(1.03);box-shadow:0 0 0 3px var(--fg)}
.bar-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.scan{max-width:40rem;margin:18vh auto 0;text-align:center}
.prog{height:.4rem;background:var(--line);border-radius:1rem;overflow:hidden;margin:1.6rem 0 1rem}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.scan .st{display:flex;justify-content:center;gap:2.2rem;margin-top:1.8rem;font-variant-numeric:tabular-nums}
.scan .st b{display:block;font-size:2rem;font-family:var(--f-brand);font-weight:400;letter-spacing:.03em}
.scan .st span{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}
.pfs{display:flex;flex-wrap:wrap;justify-content:center;gap:1.8rem;margin-top:2.6rem}
.pf{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.8rem;color:var(--mute);font-weight:600;font-size:1.1rem}
.av{width:9rem;height:9rem;border-radius:.5rem;display:grid;place-items:center;font:400 4.4rem/1 var(--f-brand);color:#fff;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.av::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 6px,transparent 6px 14px)}
.av span{position:relative}
.av.add{background:transparent;border:2px dashed var(--dim);color:var(--dim);font:300 4rem/1 var(--f-body)}
.pf:focus .av{transform:scale(1.07);box-shadow:0 0 0 4px var(--fg)}
.pf:focus{color:var(--fg)}
.av.sm{width:2.4rem;height:2.4rem;font-size:1.3rem;border-radius:.3rem}
.colors{display:flex;gap:.7rem;flex-wrap:wrap}
.sw{width:3rem;height:3rem;border-radius:.4rem;border:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.sw:focus{transform:scale(1.12)}

/* ---------- Live-TV ---------- */
.live-w{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.6rem;align-items:start}
.cats{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:1rem;max-height:calc(100vh - 8rem);overflow-y:auto;scrollbar-width:thin}
.cat{display:flex;justify-content:space-between;gap:.6rem;text-align:left;background:none;border:0;padding:.6rem .8rem;border-radius:.35rem;color:var(--mute);font-weight:600;cursor:pointer;font-size:.95rem}
.cat em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}
.cath{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:.9rem .8rem .3rem}
.crow{display:flex;gap:.25rem;align-items:stretch}
.crow .cat{flex:1;min-width:0}
.crow .cat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead{font-weight:800;color:var(--fg)}
.csub{padding-left:.7rem;border-left:2px solid var(--line);margin:.1rem 0 .4rem .5rem;display:flex;flex-direction:column;gap:.15rem}
.mini{flex:0 0 2rem;width:2rem;display:grid;place-items:center;background:none;border:0;border-radius:.35rem;color:var(--dim);font-size:.9rem;cursor:pointer}
.mini.ph{visibility:hidden}
.mini:focus{background:var(--fg);color:#111}
.cath small{font-weight:600;letter-spacing:0;text-transform:none;margin-left:.3rem}
.chw{display:flex;gap:.3rem;align-items:stretch;min-width:0}
.chw .chr{flex:1;min-width:0}
.chw .mini{flex-basis:2.4rem;width:2.4rem;background:var(--bg2);font-size:1.1rem;color:var(--gold)}
.cat.on{color:var(--fg);background:rgba(255,255,255,.06)}
.cat:focus{background:var(--fg);color:#111}
.cat:focus em{color:#444}
.chl{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.lvh .lhead{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;margin-bottom:.6rem}.lvh .lhead .vsub{margin:0}
.lvh .live-w{grid-template-columns:14.5rem minmax(0,1fr);gap:1.4rem}
.lvh .cats{gap:.15rem}.lvh .cat{padding:.62rem .8rem;font-size:1rem}.lvh .cat.sm2{font-size:.9rem}
.csep{height:1px;background:var(--line);margin:.45rem .4rem}
.lbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.5rem}.lbar h3{margin:0;font-size:1.25rem}.lbar h3 small{color:var(--dim);font-weight:600;font-size:.85rem;margin-left:.4rem}
.lchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:.2rem .1rem .7rem;margin-bottom:.2rem}.lchips .chip{flex:0 0 auto}.lchips small{opacity:.6;margin-left:.2rem}
.chr .epb{display:block;height:3px;max-width:18rem;background:rgba(255,255,255,.14);border-radius:2px;margin-top:.4rem;overflow:hidden}.chr .epb i{display:block;height:100%;background:var(--red)}
.chr:focus .epb{background:rgba(0,0,0,.15)}
.chr .qn{font-size:.72rem;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:.25rem;padding:0 .3rem;vertical-align:2px}
.chw .mini.fv{color:var(--gold)}
.chr{display:grid;grid-template-columns:2.6rem 7.5rem minmax(0,1fr) auto;gap:1rem;align-items:center;text-align:left;background:var(--bg2);border:0;border-radius:.45rem;padding:.55rem 1rem .55rem .7rem;cursor:pointer;min-width:0;transition:transform .12s}
.chr .no{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.chr .lg{position:relative;height:3.6rem;border-radius:.3rem;overflow:hidden}
.chr .lg .logo span{font-size:1rem}
.chr .tx{min-width:0}
.chr .tx b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chr .tx div{color:var(--mute);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
.chr .tx .pb{height:.2rem;background:var(--line);border-radius:1rem;margin-top:.4rem;max-width:22rem;overflow:hidden}
.chr .tx .pb i{display:block;height:100%;background:var(--red)}
.chr .nx{color:var(--dim);font-size:.82rem;max-width:14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chr:focus{background:var(--fg);color:#111;transform:scale(1.01)}
.chr:focus .tx div,.chr:focus .nx,.chr:focus .no{color:#444}

/* ---------- Sport ---------- */
.ev{flex:0 0 22rem;max-width:100%;text-align:left;border:0;cursor:pointer;border-radius:.55rem;padding:1.1rem 1.2rem;background:linear-gradient(135deg,#2a1414,#151010 60%);display:flex;flex-direction:column;gap:.55rem;position:relative;overflow:hidden;transition:transform .15s}
.ev::before{content:"";position:absolute;right:-3rem;top:-3rem;width:9rem;height:9rem;border-radius:50%;border:1.5rem solid rgba(227,38,45,.12)}
.ev .lg2{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-size:.8rem;color:var(--mute);font-weight:700;letter-spacing:.04em;position:relative}
.ev .tt{font-size:1.25rem;font-weight:800;line-height:1.25;position:relative;text-wrap:balance}
.ev .tm{color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums;position:relative}
.ev .pb{height:.22rem;background:rgba(255,255,255,.12);border-radius:1rem;overflow:hidden;position:relative}
.ev .pb i{display:block;height:100%;background:var(--red)}
.ev.team{background:linear-gradient(135deg,#6a1216,#221313 72%);box-shadow:inset 0 0 0 1px rgba(255,84,90,.45)}
.tbadge{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--fg);color:#111;font:800 .62rem/1 var(--f-body);margin-right:.3rem;vertical-align:middle}
.uplert{position:fixed;left:max(calc(var(--rail) + 1.2rem),env(safe-area-inset-left,0px));bottom:max(1.2rem,env(safe-area-inset-bottom,0px));z-index:96;background:rgba(25,21,21,.95);border:1px solid rgba(242,194,48,.55);border-radius:.55rem;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.55rem;width:min(20rem,calc(100vw - 32px));font-size:.88rem;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fade .25s}
.uplert .lg2{display:flex;gap:.6rem;align-items:center}
.uplert .notes{margin:.35rem 0;font-size:.82rem;color:#ddd5d2;white-space:pre-line;line-height:1.45;font-size:.92rem}
.uplert small{color:var(--mute);display:block}
.talert{position:fixed;right:max(1.2rem,env(safe-area-inset-right,0px));bottom:max(1.2rem,env(safe-area-inset-bottom,0px));z-index:95;background:rgba(28,20,20,.94);border:1px solid rgba(227,38,45,.6);border-radius:.55rem;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.55rem;width:min(19rem,calc(100vw - 32px));font-size:.88rem;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fade .25s}
.talert .lg2{display:flex;gap:.6rem;align-items:center}
.talert .tt{font-weight:800;font-size:.98rem;margin:.3rem 0 .1rem}
.talert small{color:var(--mute)}
.ev:focus{transform:scale(1.04);box-shadow:0 0 0 3px var(--fg)}

/* ---------- Details ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,4,4,.72);overflow-y:auto;overflow-x:hidden;padding:3vh max(16px,env(safe-area-inset-right,0px)) 6vh max(16px,env(safe-area-inset-left,0px));animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{max-width:50rem;margin:0 auto;background:var(--bg2);border-radius:.7rem;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.8)}
.hero{position:relative;height:clamp(10rem,30vh,17rem)}
.hero .art,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 2%,rgba(22,18,18,.2) 55%,rgba(22,18,18,0))}
.hero .ht{position:absolute;left:2rem;right:2rem;bottom:1rem;z-index:2}
.hero .ht .s-title{font-size:2.2rem}
.modal{padding-top:5vh}
.sheet .acts .btn{padding:.55rem 1.1rem;font-size:.95rem}
.sheet .acts .btn.ic{padding:.55rem}
.dbody{font-size:.94rem}
.dbody p.plot{font-size:.98rem}
.dbody{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:2.2rem;padding:0 2rem 2rem}
.dbody p.plot{font-size:1.05rem;line-height:1.6;color:#e2dad7;margin:0}
.side{font-size:.92rem;color:var(--mute);line-height:1.55;display:flex;flex-direction:column;gap:.7rem}
.side b{color:#cfc6c3;font-weight:600}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin:.9rem 0 1.1rem}
.dsec{padding:0 2rem 1.8rem}
.dsec h4{margin:0 0 .8rem;font-size:1.25rem}
.eps{display:flex;flex-direction:column;gap:.4rem;margin-top:1rem}
.ep{display:grid;grid-template-columns:2.4rem 11rem minmax(0,1fr) auto;gap:1.1rem;align-items:center;text-align:left;border:0;background:none;border-radius:.45rem;padding:.7rem;cursor:pointer;border-bottom:1px solid var(--line)}
.ep .en{font-size:1.5rem;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.ep .et{position:relative;aspect-ratio:16/9;border-radius:.3rem;overflow:hidden;max-width:100%}
.ep .ex b{display:block;margin-bottom:.25rem}
.ep .ex p{margin:0;color:var(--mute);font-size:.88rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .ed{color:var(--mute);font-size:.88rem;font-variant-numeric:tabular-nums}
.ep:focus{background:#2a2222;box-shadow:inset 0 0 0 2px var(--fg)}

/* ---------- Player ---------- */
.player{position:fixed;inset:0;z-index:80;background:#000;overflow:hidden}
.player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.sim{position:absolute;inset:0;overflow:hidden}
.sim .art{animation:kb 26s ease-in-out infinite alternate;inset:-6%}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-3%,2%)}}
.sim::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 50%,transparent,rgba(0,0,0,.55));animation:flick 3.4s steps(6) infinite}
@keyframes flick{50%{opacity:.85}}
.simlogo{position:absolute;inset:-6%;animation:kb 26s ease-in-out infinite alternate}
.simlogo .logo span{font-size:6rem;opacity:.8}
.spot .bd .logo span{font-size:4rem;opacity:.4}
.sim .lab{position:absolute;top:1.4rem;right:max(1.4rem,env(safe-area-inset-right,0px));z-index:2;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);padding:.4rem .75rem;border-radius:2rem;font-size:.8rem;font-weight:700;color:#ddd}
.pc{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:5rem max(2.4rem,env(safe-area-inset-right,0px)) max(2rem,env(safe-area-inset-bottom,0px)) max(2.4rem,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(0,0,0,.92),transparent);transition:opacity .3s}
.pt{position:absolute;top:0;left:0;right:0;z-index:5;padding:max(1.6rem,env(safe-area-inset-top,0px)) 2.4rem 4rem;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:opacity .3s}
.pt h2{margin:0;font-size:1.8rem;font-weight:800}
.pt p{margin:.3rem 0 0;color:var(--mute)}
.player.idle .pc,.player.idle .pt{opacity:0}
.scrub{display:block;width:100%;height:1.6rem;background:none;border:0;padding:.6rem 0;cursor:pointer;position:relative}
.scrub .tr{position:relative;height:.36rem;background:rgba(255,255,255,.25);border-radius:1rem}
.scrub .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:1rem}
.scrub .tr b{position:absolute;top:50%;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);transition:transform .15s}
.scrub:focus .tr b{transform:translate(-50%,-50%) scale(1.5);background:#fff}
.ptime{display:flex;justify-content:space-between;color:#ddd;font-variant-numeric:tabular-nums;font-size:.95rem;margin:.2rem 0 1rem}
.pbtns{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.pbtns .sp{flex:1}
.player.nat{background:transparent}
html.vidmode,html.vidmode body{background:transparent!important}
html.vidmode #app,html.vidmode .modal{visibility:hidden}
.pspin{position:absolute;inset:0;display:none;place-items:center;z-index:3}
.player.buf .pspin{display:grid}
.ap{position:absolute;top:0;right:0;bottom:0;width:min(25rem,100vw);z-index:8;background:rgba(14,11,11,.95);border-left:1px solid var(--line);padding:1.4rem max(1.3rem,env(safe-area-inset-right,0px)) 1.4rem 1.3rem;overflow-y:auto;display:flex;flex-direction:column;gap:.3rem;animation:fade .15s}
.ap h3{margin:0 0 .4rem;font-size:1.25rem}
.ap h4{margin:.9rem 0 .25rem;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.apo{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;border-radius:.4rem;padding:.55rem .7rem;color:var(--fg);font-weight:600;font-size:.95rem;cursor:pointer}
.apo svg{width:1.1rem;height:1.1rem;color:var(--red);flex:0 0 auto}
.apo .apdot{width:1.1rem;height:1.1rem;flex:0 0 auto}
.apo:focus{background:var(--fg);color:#111}
.apo:focus svg{color:#111}
.aph{color:var(--mute);font-size:.82rem;line-height:1.45;margin:.1rem 0 .3rem}
.apsync{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.2rem 0}
.apsync b{min-width:4.6rem;text-align:center;font-variant-numeric:tabular-nums;font-size:1.05rem}
.nav.upd svg{color:var(--gold)}
.nav.upd::after{content:"";position:absolute;margin-left:1.05rem;margin-top:-1.1rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--red)}
.updbox{border:1px solid rgba(242,194,48,.5);background:rgba(242,194,48,.06);border-radius:.6rem;padding:1rem 1.1rem;margin:.6rem 0 1rem;display:flex;flex-direction:column;gap:.35rem}
.updbox p{margin:.2rem 0;white-space:pre-line;color:#ddd5d2;font-size:.9rem;line-height:1.5}
.updbox small,.updbox .ust{color:var(--mute);font-size:.85rem}
.prepill{position:fixed;left:max(calc(var(--rail) + 1.2rem),env(safe-area-inset-left,0px));bottom:max(1.2rem,env(safe-area-inset-bottom,0px));z-index:90;background:rgba(25,21,21,.95);border:1px solid var(--line);border-radius:.55rem;padding:.6rem .8rem .8rem;display:flex;flex-direction:column;gap:.15rem;width:min(19rem,calc(100vw - 32px));font-size:.82rem;overflow:hidden}
.prepill span{color:var(--mute)}
.prepill i{position:absolute;left:0;bottom:0;height:.2rem;background:var(--red);transition:width .4s}
.perr{position:absolute;inset:0;display:grid;place-items:center;z-index:4;text-align:center;padding:2rem}
.perr div{max-width:34rem;background:rgba(0,0,0,.75);padding:1.6rem;border-radius:.6rem;border:1px solid var(--line);line-height:1.5}

/* ---------- Einstellungen ---------- */
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));gap:1.2rem;margin-top:1rem}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:.6rem;padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;min-width:0}
.box h4{margin:0;font-size:1.15rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.92rem;color:var(--mute)}
.kv b{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.tb{display:grid;grid-template-columns:8rem 1fr 3rem;gap:.7rem;align-items:center;font-size:.9rem}
.tb .bt{height:.6rem;background:var(--line);border-radius:1rem;overflow:hidden}
.tb .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2))}
.tb em{font-style:normal;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}

.setw{grid-template-columns:15rem minmax(0,1fr)}
.spanel{min-width:0;display:flex;flex-direction:column}
.spanel h3{margin:0 0 .4rem;font-size:1.4rem}
.orow{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr);gap:1.2rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
.ol b{display:block;font-size:1rem}
.ol small{display:block;color:var(--mute);font-size:.82rem;line-height:1.45;margin-top:.2rem}
.oc{min-width:0;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tgl{display:inline-flex;align-items:center;gap:.6rem;background:none;border:0;cursor:pointer;color:var(--mute);font-weight:700;padding:.3rem;border-radius:2rem}
.tgl i{width:2.6rem;height:1.45rem;border-radius:1rem;background:var(--line);position:relative;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.05rem;height:1.05rem;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{color:var(--fg)}
.tgl.on i{background:var(--red)}
.tgl.on i::after{transform:translateX(1.15rem)}
.tgl:focus{box-shadow:0 0 0 3px var(--fg)}
html.pz-s .card{flex-basis:7.6rem}
html.pz-l .card{flex-basis:11.5rem}
html.pz-s .card.w{flex-basis:13.5rem}
html.pz-l .card.w{flex-basis:19rem}
html.pz-s .grid{grid-template-columns:repeat(auto-fill,minmax(7.6rem,1fr))}
html.pz-l .grid{grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr))}
html.nomotion *,html.nomotion *::before,html.nomotion *::after{transition:none!important;animation:none!important}
/* Intro */
.intro{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at center,#2a0507 0%,#0b0606 55%,#000 100%);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.intro::before{content:"";position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin;border-radius:50%;background:radial-gradient(circle,rgba(229,9,20,.55),transparent 65%);opacity:0;transform:scale(.4);animation:iglow 1.6s .55s ease-out both}
.intro .stage{display:flex;flex-direction:column;align-items:center;gap:1.6rem;animation:izoom .55s 2.55s cubic-bezier(.5,0,.75,0) both}
.intro .ilogo{position:relative;width:8.5rem;height:8.5rem;border-radius:50%;overflow:hidden}
.intro .ilogo i{position:absolute;display:block}
.intro .r1{inset:0;border-radius:50%;border:.55rem solid #e50914;box-shadow:inset 0 0 1.2rem rgba(229,9,20,.6);transform:scale(0);animation:iring .5s .18s cubic-bezier(.2,.9,.3,1.25) both}
.intro .r2{inset:1.15rem;border-radius:50%;border:.22rem solid rgba(255,120,120,.55);transform:scale(0);animation:iring .45s .34s cubic-bezier(.2,.9,.3,1.25) both}
.intro .pl{left:3.1rem;top:2.45rem;width:3.1rem;height:3.6rem;background:linear-gradient(135deg,#fff 10%,#ffc2c2 60%,#ff6b6b);clip-path:polygon(0 0,100% 50%,0 100%);transform:scale(0) rotate(-120deg);animation:iplay .42s .5s cubic-bezier(.2,.9,.3,1.3) both}
.intro .ilogo .sh{position:absolute;top:-10%;bottom:-10%;width:45%;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-170%) skewX(-18deg);animation:ishine .6s 1.05s ease-in-out both}
.intro .iw{font:400 2.6rem/1 var(--f-brand);letter-spacing:.32em;color:#f3eded;padding-left:.32em;display:flex}
.intro .iw span{display:inline-block;opacity:0;transform:translateY(.5em);animation:ilt .4s cubic-bezier(.2,.8,.2,1) both}
.intro.out{opacity:0;transition:opacity .35s}
@keyframes iring{to{transform:scale(1)}}
@keyframes iplay{to{transform:none}}
@keyframes ishine{to{transform:translateX(330%) skewX(-18deg)}}
@keyframes ilt{to{opacity:1;transform:none}}
@keyframes iglow{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:.35;transform:scale(1.25)}}
@keyframes izoom{to{transform:scale(1.35);opacity:0}}
/* Flüssig-Modus (Fire TV): keine teuren Effekte, sofortiges Scrollen */
html.lite .main,html.lite .rows,html.lite .track,html.lite .cats,html.lite .chl,html.lite .scr,html.lite .modal{scroll-behavior:auto!important}
html.lite .bd.kb .bdimg,html.lite .hero .bd.kb>.art,html.lite .hero .bd.kb>img{animation:none!important}
html.lite .spot{transition:none!important}
html.lite .m4::before{filter:none;opacity:.55}
html.lite .card{transition:transform .1s ease}
html.lite .card:focus{box-shadow:0 0 0 3px var(--fg)}
html.lite .ev,html.lite .cc,html.lite .chr,html.lite .btn{transition:none}
html.nomotion .intro .iw span{opacity:1;transform:none}
html.nonums .chr .no{visibility:hidden}
@media (max-width:760px){.setw{grid-template-columns:1fr}.orow{grid-template-columns:1fr;gap:.6rem}}
.toast{position:fixed;left:50%;bottom:max(2rem,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--fg);color:#111;font-weight:700;padding:.75rem 1.3rem;border-radius:.4rem;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s}
.spin{width:3rem;height:3rem;border-radius:50%;border:.3rem solid var(--line);border-top-color:var(--red);animation:rot 1s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.stp{list-style:none;margin:1.6rem auto 0;padding:0;display:grid;gap:.5rem;max-width:34rem;text-align:left}

      pushMovie(cc,titles[i],1998+Math.floor(rr()*28),gs,+(5.2+rr()*2.6).toFixed(1),Math.floor(35+rr()*55),Math.floor(40+rr()*50),85+Math.floor(rr()*50),rr()<.15,rr,0)}
    const ns=Math.min(DEMO.nsr[cc],titles.length-nm);

  }

  return _demoRaw=out;
}

async function bgRefresh(){if(_bgBusy||!APP.cfg||APP.cfg.mode==='demo')return;
  if(APP.noWorker&&(P.el||Date.now()-(APP.lastKey||0)<60000))return; // ohne Hintergrund-Worker nur, wenn die App ruht

  try{await waitIdle(4000);let res;try{res=await loadCatalog(null)}catch(e){return}
    if(res.sig&&res.sig===APP.sig){CACHE.t=Date.now();return} // nichts Neues → nichts umbauen
    await waitIdle(6000);
    const before=new Set(APP.items.map(i=>i.id));applyCatalog(res);CACHE.save(res.json);
    const fresh=APP.items.filter(i=>!before.has(i.id)&&i.type!=='live');

   ein Geschmacksvektor mit Zeitverfall (Halbwertszeit 21 Tage) und Tageszeit-Gewichtung. Bewertung = Kosinus-Ähnlichkeit

// Filme: Sprache (= Ton) und Bildqualität getrennt wählen. Gibt es die Qualität nicht in der Sprache,
// kommt das Bild aus einer anderen Fassung und der Ton aus der gewählten Sprache.
function selOf(it){const c=(LS.get('nfk.vs.'+APP.pid,{})||{})[it.id]||{};const ls=langsOf(it);return{l:c.l&&ls.includes(c.l)?c.l:ls[0],q:c.q&&it.versions.some(v=>(v.q||'-')===c.q)?c.q:''}}
function saveSel(it,l,q){const m=LS.get('nfk.vs.'+APP.pid,{})||{};m[it.id]={l,q:q||''};const k=Object.keys(m);if(k.length>400)delete m[k[0]];LS.set('nfk.vs.'+APP.pid,m);it._vsel=null;it._mixA=it._mixV=null}
function playPlan(it){const{l,q}=selOf(it);const own=it.versions.filter(v=>v.lang===l).sort((a,b)=>qRank(b.q)-qRank(a.q));let pic=null;
  if(q)pic=own.find(v=>(v.q||'-')===q)||it.versions.filter(v=>(v.q||'-')===q).sort((a,b)=>prefIdx(a.lang)-prefIdx(b.lang))[0];
  if(!pic){pic=own[0];const best=it.versions.slice().sort((a,b)=>qRank(b.q)-qRank(a.q)||(a.lang===l?-1:b.lang===l?1:prefIdx(a.lang)-prefIdx(b.lang)))[0];if(PS('mix')!=='off'&&it.type==='movie'&&best&&pic&&best.lang!==l&&qRank(best.q)>qRank(pic.q))pic=best}
  pic=pic||sortedVersions(it)[0];const aud=it.type==='movie'&&pic.lang!==l&&PS('mix')!=='off'?audioVer(it,l):null;return{pic,aud,l,q}}
const fl=l=>CBY[l]&&CBY[l].flag?CBY[l].flag+' ':'';
function prepEta(it,l){const a=audioVer(it,l)||{};const mb=({'8K':40,'4K':18,FHD:6,HD:3.5,SD:1.5})[a.q]||2;const tot=mb*(it.dur||110)*60/8;const b=BW.get();return b?Math.max(1,Math.round(tot*8/(b.mbps*.85)/60)):null}
function langChips(it){if(it.type==='movie')return movieChips(it);const ls=langsOf(it);const cv=curVer(it);let h='';
  if(ls.length>1)h+=`<label class="lb">Sprache</label><div class="chips" style="margin-bottom:.8rem">${ls.map(l=>`<button class="chip f${l===cv.lang?' on':''}" data-act="dlang" data-id="${it.id}" data-l="${l}">${CBY[l]&&CBY[l].flag?CBY[l].flag+' ':''}${esc(langName(l))}${bestQ(it,l)?' · '+bestQ(it,l):''}</button>`).join('')}</div>`;
  {const bp=bestPic(it);const myQ=QR[(sortedVersions(it).find(v=>v.lang===cv.lang)||{}).q||''];if(PS('mix')!=='off'&&it.type==='movie'&&bp&&bp.lang!==cv.lang&&QR[bp.q]>myQ){const on=!!(it._mixA&&it._mixA.lang===cv.lang);
    const fl=CBY[cv.lang]&&CBY[cv.lang].flag?CBY[cv.lang].flag+' ':'';const run=APP.prepRun&&APP.prepRun.itemId===it.id&&APP.prepRun.lang===cv.lang;
    const needPrep=canPrep()&&!mixDirect()&&!prepared(it,cv.lang);
    h+=`<label class="lb">Bild & Ton kombinieren</label><div class="chips" style="margin-bottom:.8rem">${needPrep?`<button class="chip f" data-act="dprep" data-id="${it.id}" data-l="${cv.lang}">${run?`${fl}${esc(langName(cv.lang))}-Ton wird vorbereitet … ${APP.prepRun.pct} %`:`${bp.q==='4K'?'4K':bp.q}-Bild + ${fl}${esc(langName(cv.lang))}-Ton: Ton vorbereiten (einmalig, ca. 100–600 MB)`}</button>`
      :`<button class="chip f${on?' on':''}" data-act="dmix" data-id="${it.id}">${bp.q==='4K'?'4K':bp.q}-Bild + ${fl}${esc(langName(cv.lang))}-Ton${prepared(it,cv.lang)?' · Ton gespeichert':''}</button>`}</div>`}}
  // Alle Qualitäten anzeigen (auch aus anderen Sprachfassungen – dann mit Sprache dahinter)
  const qv=[];for(const v of it.versions.slice().sort((a,b)=>QR[b.q]-QR[a.q]||(a.lang===cv.lang?-1:b.lang===cv.lang?1:prefIdx(a.lang)-prefIdx(b.lang))))if(!qv.some(x=>x.q===v.q&&x.lang===v.lang))qv.push(v);
  if(qv.length>1&&uniq(qv.map(v=>v.q)).length>1){const auto=!it._vsel;const aq=sortedVersions(it).find(v=>v.lang===cv.lang);
    h+=`<label class="lb">Qualität</label><div class="chips"><button class="chip f${auto?' on':''}" data-act="dq" data-id="${it.id}" data-q="auto">Automatisch · ${esc(qName(aq&&aq.q))}<small style="opacity:.7;font-weight:500"> (${esc(BW.label())})</small></button>${qv.map(v=>`<button class="chip f${!auto&&cv.q===v.q&&cv.lang===v.lang?' on':''}" data-act="dq" data-id="${it.id}" data-q="${v.q||'-'}" data-l="${v.lang}">${esc(qName(v.q))}${v.lang!==cv.lang?` · ${CBY[v.lang]&&CBY[v.lang].flag?CBY[v.lang].flag+' ':''}${esc(langName(v.lang))}`:''}${QR[v.q]>=4?' · schnelles Internet':''}</button>`).join('')}</div>`}
  if(it.type==='series')h+=subChips(it);
  return h}
function seriesSubs(it){return subChips(it)}
function movieChips(it){const pl=playPlan(it);const ls=langsOf(it);let h='';
  if(ls.length>1)h+=`<label class="lb">Sprache (Ton)</label><div class="chips" style="margin-bottom:.8rem">${ls.map(l=>`<button class="chip f${l===pl.l?' on':''}" data-act="dlang" data-id="${it.id}" data-l="${l}">${fl(l)}${esc(langName(l))}${bestQ(it,l)?' · '+esc(qName(bestQ(it,l))):''}</button>`).join('')}</div>`;

   case'delprof':if(b.dataset.sure){APP.profiles=APP.profiles.filter(p=>p.id!==APP.pid);['ev','pr','rt','ls','ch'].forEach(k=>LS.del('nfk.'+k+'.'+APP.pid));_pc=_rc=null;saveProfiles();APP.pid=null;LS.del('nfk.pid');APP.profiles.length?vProfiles():vCountries({fresh:true})}else{b.dataset.sure=1;b.textContent='Wirklich löschen?'}break;
  }
});

// ---------- Fernbedienung / Tastatur (räumliche Navigation) ----------
function layer(){return $('.talert')||$('.uplert')||$('.ap')||$('#player')||(APP.modal&&APP.modal.el)||$('#app')}
function focusables(){return $$('.f',layer()).filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.disabled})}
// Schnelle Wege (ohne alle Elemente der Seite zu vermessen): Nachbar in der Reihe, Nachbar-Reihe, Spalten
function fastMove(cur,dir){const H=dir==='left'||dir==='right';const tr=cur.closest('.track');
  if(tr&&H){const a=tr.querySelectorAll('.f');let i=-1;for(let k=0;k<a.length;k++)if(a[k]===cur){i=k;break}const n=a[i+(dir==='right'?1:-1)];return n||(dir==='right'?cur:null)}
  if(tr&&!H){const row=cur.closest('.row');if(!row||!row.parentElement||!row.parentElement.classList.contains('rows'))return null;let r=row;const cx=cur.getBoundingClientRect().left;
    for(;;){r=dir==='down'?r.nextElementSibling:r.previousElementSibling;if(!r)return null;const cs=r.querySelectorAll('.f');if(!cs.length)continue;let best=null,bd=1e9;
      for(const c of cs){const q=c.getBoundingClientRect();if(!q.width)continue;const d=Math.abs(q.left-cx);if(d<bd){bd=d;best=c}if(q.left>cx+400)break}if(best)return best}}
  return null}
function navMove(dir){
  {const a=document.activeElement;if(a&&a.classList&&a.classList.contains('f')&&layer().contains(a)){const n=fastMove(a,dir);if(n===a)return;if(n){APP.kbd=true;n.focus({preventScroll:true});ensureVisible(n);return}
    // Spalten (Kategorien, Senderliste, Einstellungen, Menüs): nur dort suchen
    if(dir==='up'||dir==='down'){const col=a.closest('.cats,.chl,.spanel,.ap');if(col){const n2=pickDir(a,dir,[...col.querySelectorAll('.f')]);if(n2){APP.kbd=true;n2.focus({preventScroll:true});ensureVisible(n2);return}}}}}
  const list=focusables();const cur=document.activeElement&&list.includes(document.activeElement)?document.activeElement:null;
  if(!cur){(list.find(x=>x.closest('#main'))||list[0])?.focus();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const H=dir==='left'||dir==='right';
  const inRail=!!cur.closest('.rail');
  let c=list.filter(el=>el!==cur&&(!!el.closest('.rail')===inRail||(dir==='left'&&!inRail)||(dir==='right'&&inRail))).map(el=>{const q=el.getBoundingClientRect(),qx=q.left+q.width/2,qy=q.top+q.height/2;
    let main,cross,ok;
    if(dir==='right'){ok=qx>cx+2&&q.left>=r.left+4;main=Math.max(0,q.left-r.right);cross=Math.abs(qy-cy)}
    else if(dir==='left'){ok=qx<cx-2&&q.right<=r.right-4;main=Math.max(0,r.left-q.right);cross=Math.abs(qy-cy)}
    else if(dir==='down'){ok=qy>cy+2&&q.top>=r.top+4;main=Math.max(0,q.top-r.bottom);cross=Math.abs(qx-cx)}
    else{ok=qy<cy-2&&q.bottom<=r.bottom-4;main=Math.max(0,r.top-q.bottom);cross=Math.abs(qx-cx)}
    const ov=H?(q.top<r.bottom-2&&q.bottom>r.top+2):(q.left<r.right&&q.right>r.left);return{el,ok,main,cross,ov}}).filter(o=>o.ok);
  if(!c.length){if(dir==='up'&&APP.view==='home'&&cur.closest('#rows')&&(APP.hero||[]).length&&PS('hero')){showHero(APP.heroI||0,'1');$('#rows').scrollTo({top:0})}return}
  if(H){const ov=c.filter(o=>o.ov);if(ov.length)c=ov}
  // Hoch/Runter bleibt in der Spalte (Kategorien, Senderliste, Einstellungen), solange es dort weitergeht
  if(!H){const col=cur.closest('.cats,.chl,.spanel,.ap');if(col){const inCol=c.filter(o=>col.contains(o.el));if(inCol.length)c=inCol}}
  const mn=Math.min(...c.map(o=>o.main));const band=c.filter(o=>o.main<=mn+(H?40:24));band.sort((a,b)=>a.cross-b.cross||a.main-b.main);
  APP.kbd=true;band[0].el.focus({preventScroll:true});ensureVisible(band[0].el);
}
function pickDir(cur,dir,els){const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const c=[];
  for(const el of els){if(el===cur||el.disabled)continue;const q=el.getBoundingClientRect();if(!q.width)continue;const qy=q.top+q.height/2,qx=q.left+q.width/2;
    const ok=dir==='down'?qy>cy+2&&q.top>=r.top+4:qy<cy-2&&q.bottom<=r.bottom-4;if(ok)c.push({el,main:dir==='down'?Math.max(0,q.top-r.bottom):Math.max(0,r.top-q.bottom),cross:Math.abs(qx-cx)})}
  if(!c.length)return null;const mn=Math.min(...c.map(o=>o.main));const band=c.filter(o=>o.main<=mn+24);band.sort((a,b)=>a.cross-b.cross||a.main-b.main);return band[0].el}
function ensureVisible(el){
  const tr=el.closest('.track');if(tr){const r=el.getBoundingClientRect(),t=tr.getBoundingClientRect();const pad=parseFloat(getComputedStyle(tr).paddingLeft)||32;
    if(r.left<t.left+pad)tr.scrollBy({left:r.left-t.left-pad});else if(r.right>t.right-24)tr.scrollBy({left:r.right-t.right+pad})}
  const rows=el.closest('.rows');const row=el.closest('.row');
  if(rows&&row){rows.scrollTo({top:row.offsetTop-6});return}
  const sc=el.closest('.rows,.main,.modal,.scr,.cats');if(sc){const r=el.getBoundingClientRect(),s=sc.getBoundingClientRect();if(r.top<s.top+60)sc.scrollBy({top:r.top-s.top-80});else if(r.bottom>s.bottom-40)sc.scrollBy({top:r.bottom-s.bottom+80})}
}
document.addEventListener('focusin',e=>{const el=e.target;if(el.classList.contains('dot')&&el.closest('#spot')&&+el.dataset.i!==APP.heroI){showHero(+el.dataset.i,'d'+el.dataset.i);return}if($('#spot')&&el.closest('#rows')&&el.dataset.id){clearTimeout(APP._sp);APP._sp=setTimeout(()=>setSpot(el.dataset.id,el.dataset.why),document.documentElement.classList.contains('lite')?170:110)}});
document.addEventListener('mouseover',e=>{const el=e.target.closest('.f');if(!el||el===document.activeElement||el.tagName==='INPUT')return;if(APP._mm){el.focus({preventScroll:true})}});
document.addEventListener('mousemove',()=>{APP._mm=true;APP.lastKey=Date.now();APP.kbd=false;if(P.el)P.wake()},{passive:true});
function goBack(){
  {const a=$('.talert')||$('.uplert');if(a){popClose(a);return true}}
  {const a=$('.ap');if(a){a.remove();const b2=$('#apb');b2&&b2.focus();return true}}
  if(P.el){P.close();return true}if(APP.modal){closeModal();return true}
  if($('.scr')){if(APP.cfg&&APP.items.length&&prof()&&!$('.login')&&!$('.pfs')){renderApp();return true}return false}
  // Zurück = Menüleiste, und zwar auf dem Bereich, in dem man gerade ist (z. B. Sport)
  const inRail=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.rail');
  if(!inRail){const n=$('.rail .nav.on')||$('.rail .nav[data-v="home"]');if(n){n.focus({preventScroll:true});return true}}
  if(APP.view!=='home'){APP.view='home';APP.args={};APP.hist=[];renderApp('.rail .nav[data-v="home"]');return true}
  return false;
}
window.nfkBack=goBack; // wird von der Fire-TV-App bei der Zurück-Taste aufgerufen; false = App verlassen
document.addEventListener('keydown',e=>{
  APP._mm=false;APP.lastKey=Date.now();if(INTRO.el){INTRO.skip();e.preventDefault();return}const k=e.key,kc=e.keyCode;const inInput=e.target.tagName==='INPUT';
  if(P.el)P.wake();
  const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[k];
  if(P.el&&!dir&&(k===' '||k==='MediaPlayPause'||kc===179||kc===85)){e.preventDefault();P.pp();return}
  if(P.el&&(k==='MediaFastForward'||kc===228||kc===90)){P.seek(30);return}
  if(P.el&&(k==='MediaRewind'||kc===227||kc===89)){P.seek(-10);return}
  if(dir&&($('.talert')||$('.uplert'))){e.preventDefault();navMove(dir);return}
  if(dir){
    if(inInput&&(dir==='left'||dir==='right'))return;
    if(P.el&&!$('.ap')&&document.activeElement&&document.activeElement.id==='scrub'&&(dir==='left'||dir==='right')){e.preventDefault();P.seek(dir==='left'?-10:30);return}
    if(P.el&&!$('.ap')&&P.it&&P.it.type==='live'&&P.el.classList.contains('idle')&&(dir==='up'||dir==='down')){e.preventDefault();P.chan(dir==='up'?-1:1);return}
    e.preventDefault();navMove(dir);return}
  if((k==='ContextMenu'||kc===82||k==='Menu')&&!inInput&&!P.el){const el=document.activeElement;const id=el&&el.dataset&&el.dataset.id;const it=id&&APP.byId.get(id);
    if(it){e.preventDefault();toggleList(it);const st=$$(`.mini[data-act="lfav"][data-id="${id}"]`);st.forEach(x=>{const f=isFav(it);x.textContent=f?'★':'☆';x.classList.toggle('fv',f)});return}}
  if(k==='Enter'&&inInput){if(e.target.closest('form'))return;e.preventDefault();navMove('down');return}
  if(k==='Escape'||k==='GoBack'||k==='BrowserBack'||kc===4||kc===10009||kc===461||(k==='Backspace'&&!inInput)){e.preventDefault();goBack();return}
});

// ---------- Intro beim Start: eigenes Logo-Motiv + eigener Klang (live mit Web Audio erzeugt) ----------
const INTRO={el:null,
  cfg(){return Object.assign({on:1,sound:1},LS.get('nfk.intro',{})||{})},
  set(k,v){const c=INTRO.cfg();c[k]=v;LS.set('nfk.intro',c)},
  play(force){const c=INTRO.cfg();if((!c.on&&!force)||/recovered/.test(location.hash))return Promise.resolve();
    return new Promise(res=>{$$('.intro').forEach(x=>x.remove());const d=document.createElement('div');d.className='intro';
      d.innerHTML=`<div class="stage"><div class="ilogo"><i class="r1"></i><i class="r2"></i><i class="pl"></i><span class="sh"></span></div><div class="iw">${'NETEFELIKS'.split('').map((ch,i)=>`<span style="animation-delay:${1.02+i*.045}s">${ch}</span>`).join('')}</div></div>`;
      d.addEventListener('click',()=>INTRO.skip());document.body.appendChild(d);INTRO.el=d;INTRO._res=res;if(c.sound)INTRO.sound();INTRO._t=setTimeout(()=>INTRO.skip(),3200)})},
  skip(){const d=INTRO.el;if(!d)return;INTRO.el=null;clearTimeout(INTRO._t);d.classList.add('out');setTimeout(()=>d.remove(),400);
    try{if(INTRO._ac&&INTRO._g)INTRO._g.gain.setTargetAtTime(0,INTRO._ac.currentTime,.15)}catch(e){}const r=INTRO._res;INTRO._res=null;r&&r()},
  sound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC();INTRO._ac=ac;if(ac.state==='suspended')ac.resume();const t=ac.currentTime+.06;
    const out=ac.createGain();out.gain.value=.5;INTRO._g=out;out.connect(ac.destination);
    // Hall
    const rv=ac.createConvolver();const len=Math.floor(ac.sampleRate*2.2),ir=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    rv.buffer=ir;const wet=ac.createGain();wet.gain.value=.3;out.connect(rv);rv.connect(wet);wet.connect(ac.destination);
    // 1) Luftzug: Rauschen, Filter fährt nach oben
    const nb=ac.createBuffer(1,Math.floor(ac.sampleRate*1.2),ac.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const ns=ac.createBufferSource();ns.buffer=nb;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;bp.frequency.setValueAtTime(240,t);bp.frequency.exponentialRampToValueAtTime(4200,t+.72);
    const ng=ac.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.3,t+.5);ng.gain.exponentialRampToValueAtTime(.001,t+.95);ns.connect(bp);bp.connect(ng);ng.connect(out);ns.start(t);ns.stop(t+1.2);
    // 2) Tiefer Schlag, wenn das Play-Zeichen landet
    const hit=t+.8;const k=ac.createOscillator();k.type='sine';k.frequency.setValueAtTime(130,hit);k.frequency.exponentialRampToValueAtTime(38,hit+.35);
    const kg=ac.createGain();kg.gain.setValueAtTime(.0001,hit);kg.gain.exponentialRampToValueAtTime(.95,hit+.012);kg.gain.exponentialRampToValueAtTime(.001,hit+.9);k.connect(kg);kg.connect(out);k.start(hit);k.stop(hit+1);
    // 3) Warmer, sich öffnender Akkord (D-Dur mit großer Septime und None)
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.Q.value=.7;lp.frequency.setValueAtTime(500,hit);lp.frequency.exponentialRampToValueAtTime(3600,hit+1.4);
    const pg=ac.createGain();pg.gain.setValueAtTime(.0001,hit);pg.gain.exponentialRampToValueAtTime(.14,hit+.08);pg.gain.exponentialRampToValueAtTime(.001,hit+2.4);lp.connect(pg);pg.connect(out);
    for(const[f,dt]of[[73.42,0],[146.83,0],[220,3],[277.18,-4],[329.63,5],[440,-3]]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(hit);o.stop(hit+2.5)}
    // 4) Signatur: zwei helle, aufsteigende Töne zum Lichtstreif
    for(const[f,at]of[[880,1.12],[1318.5,1.3]]){const o=ac.createOscillator();o.type='triangle';o.frequency.value=f;const g=ac.createGain();const st=t+at;
      g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.2,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+1.1);o.connect(g);g.connect(out);o.start(st);o.stop(st+1.2)}
    setTimeout(()=>{try{ac.close()}catch(e){}},5200)}catch(e){}}};
function vCrash(){screen(`<div class="scan"><h1 class="wordmark" style="font-size:3.4rem">NETEFELIKS</h1><p style="max-width:34rem;margin:1rem auto;line-height:1.6">Beim Einlesen deiner Playlist ist dem Fire TV kurz der Arbeitsspeicher ausgegangen – die App wurde neu gestartet.<br>Schließe am besten andere Apps (Fire-TV-Taste gedrückt halten → Apps) und versuche es noch einmal.</p><button class="btn pri f" data-act="rescan" data-autofocus>Erneut einlesen</button></div>`)}
// ---------- Start ----------
(async function boot(){
  const intro=INTRO.play();const crashed=/recovered/.test(location.hash);const scanCrash=crashed&&LS.get('nfk.scanning',0);LS.del('nfk.scanning');
  if(!APP.cfg){await intro;vLogin();return}
  // Gespeicherte Playlist sofort nutzen (lädt während des Intros), frische Daten kommen im Hintergrund
  if(crashed){const n=LS.get('nfk.now',{})||{};const l=LS.get('nfk.crashes',[])||[];l.push({t:Date.now(),why:(location.hash.split('-')[1]||'?'),v:n.v||'',play:!!n.play});LS.set('nfk.crashes',l.slice(-10))}
  if(APP.cfg.mode!=='demo'&&await CACHE.load()){await intro;if(!(crashed&&resumeAfterCrash()))afterLoad();startBg();BW.auto();if(crashed)setTimeout(()=>toast('Kurz neu geladen – es geht weiter, wo du warst'),800);return}
  await intro;if(scanCrash){vCrash();return}
  await startScan();startBg();if(APP.cfg.mode!=='demo')BW.auto();
})();
